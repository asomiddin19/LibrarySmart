name: Library Smart Mobile API CI
on:
  pull_request:
    paths:
      - 'library/**'
      - 'config/**'
      - 'mobile/**'
      - 'requirements.txt'
      - '.github/workflows/mobile-api.yml'
  workflow_dispatch:

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt Pillow
      - run: python manage.py check
      - run: python manage.py test library.test_mobile_api

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms android,ios .
      - run: flutter pub get
      - run: flutter analyze lib
