name: Library Smart Staging Authentication E2E

on:
  pull_request:
    paths:
      - 'scripts/staging_e2e.py'
      - '.github/workflows/staging-e2e.yml'
  workflow_dispatch:

jobs:
  staging-auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise staging registration, CSRF, sessions, catalogue, logout and login
        env:
          STAGING_URL: https://librarysmart-api-staging.up.railway.app
        run: python3 scripts/staging_e2e.py
